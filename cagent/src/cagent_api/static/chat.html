<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>cluster-agent</title>
<style>
  :root { color-scheme: dark light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, system-ui, sans-serif;
    background: #111; color: #eee; display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    padding: 10px 12px; background: #1a1a1a; border-bottom: 1px solid #333;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; flex: 1 1 auto; }
  button {
    font-size: 15px; padding: 10px 14px; border-radius: 8px; border: 1px solid #444;
    background: #2a2a2a; color: #eee; min-height: 40px;
  }
  button:active { background: #3a3a3a; }
  button.primary { background: #2a5db0; border-color: #2a5db0; }
  #login { display: flex; flex-direction: column; gap: 12px; padding: 24px; max-width: 480px; margin: 40px auto; }
  #login input {
    font-size: 16px; padding: 12px; border-radius: 8px; border: 1px solid #444;
    background: #1e1e1e; color: #eee;
  }
  #app { display: none; flex-direction: column; flex: 1 1 auto; min-height: 0; }
  #sessions {
    display: none; overflow-y: auto; max-height: 40vh; border-bottom: 1px solid #333; background: #161616;
  }
  #sessions.open { display: block; }
  .session-row {
    padding: 10px 12px; border-bottom: 1px solid #262626; cursor: pointer; font-size: 14px;
  }
  .session-row small { display: block; color: #888; margin-top: 2px; }
  #transcript { flex: 1 1 auto; overflow-y: auto; padding: 12px; }
  .msg { margin-bottom: 16px; }
  .msg .who { font-size: 12px; color: #888; margin-bottom: 4px; }
  .msg .bubble {
    white-space: pre-wrap; word-wrap: break-word; padding: 10px 12px; border-radius: 10px;
    background: #1e1e1e; border: 1px solid #2a2a2a;
  }
  .msg.you .bubble { background: #17324f; border-color: #1d4571; }
  .msg .state { font-size: 12px; color: #f0ad4e; margin-top: 4px; }
  .msg .state.failed, .msg .state.interrupted, .msg .state.cancelled { color: #e05555; }
  #composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #333; background: #1a1a1a; }
  #composer textarea {
    flex: 1 1 auto; font-size: 16px; padding: 10px; border-radius: 8px; border: 1px solid #444;
    background: #1e1e1e; color: #eee; resize: none; min-height: 44px; max-height: 140px;
  }
  #status-line { font-size: 12px; color: #888; padding: 4px 12px; }
  .error-box { color: #e05555; padding: 8px 12px; font-size: 14px; }
</style>
</head>
<body>

<div id="login">
  <h1>cluster-agent — human entrance</h1>
  <p>Enter the access token issued on the command node.</p>
  <input id="token-input" type="password" placeholder="token" autocomplete="off" autocapitalize="off">
  <button class="primary" id="login-btn">Enter</button>
  <div class="error-box" id="login-error"></div>
</div>

<div id="app">
  <header>
    <h1>cluster-agent</h1>
    <button id="sessions-btn">Sessions</button>
    <button id="new-btn">New chat</button>
    <button id="logout-btn">Log out</button>
  </header>
  <div id="sessions"></div>
  <div id="transcript"></div>
  <div id="status-line"></div>
  <div class="error-box" id="app-error"></div>
  <div id="composer">
    <textarea id="input" placeholder="Ask about cluster resources/services..." rows="1"></textarea>
    <button class="primary" id="send-btn">Send</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var TOKEN_KEY = "cagent_human_token";
  var POLL_MS = 2500;
  var TERMINAL = ["completed", "failed", "cancelled", "interrupted"];

  var els = {
    login: document.getElementById("login"),
    tokenInput: document.getElementById("token-input"),
    loginBtn: document.getElementById("login-btn"),
    loginError: document.getElementById("login-error"),
    app: document.getElementById("app"),
    sessionsBtn: document.getElementById("sessions-btn"),
    newBtn: document.getElementById("new-btn"),
    logoutBtn: document.getElementById("logout-btn"),
    sessions: document.getElementById("sessions"),
    transcript: document.getElementById("transcript"),
    statusLine: document.getElementById("status-line"),
    appError: document.getElementById("app-error"),
    input: document.getElementById("input"),
    sendBtn: document.getElementById("send-btn"),
  };

  var state = { sessionId: null, sending: false };

  function token() { return localStorage.getItem(TOKEN_KEY) || ""; }

  function showLogin(message) {
    els.app.style.display = "none";
    els.login.style.display = "flex";
    els.loginError.textContent = message || "";
  }

  function showApp() {
    els.login.style.display = "none";
    els.app.style.display = "flex";
  }

  function api(path, opts) {
    opts = opts || {};
    var headers = opts.headers || {};
    headers["Authorization"] = "Bearer " + token();
    if (opts.body) headers["Content-Type"] = "application/json";
    return fetch(path, {
      method: opts.method || "GET",
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    }).then(function (resp) {
      if (resp.status === 401) {
        localStorage.removeItem(TOKEN_KEY);
        showLogin("Session expired or token rejected — enter it again.");
        throw new Error("unauthorized");
      }
      return resp.json().then(function (data) {
        if (!resp.ok) throw new Error((data.error && data.error.message) || ("HTTP " + resp.status));
        return data;
      });
    });
  }

  function fmtTime(ts) {
    if (!ts) return "";
    return new Date(ts * 1000).toLocaleString();
  }

  function identityLabel(identity) {
    if (!identity) return "";
    if (identity.class === "human") return "human:" + identity.name;
    return "node:" + identity.uuid;
  }

  function renderMessage(container, request) {
    var you = document.createElement("div");
    you.className = "msg you";
    you.innerHTML =
      '<div class="who">' + identityLabel(request.identity) + " &middot; " + fmtTime(request.created_at) + '</div>' +
      '<div class="bubble"></div>';
    you.querySelector(".bubble").textContent = request.message;
    container.appendChild(you);

    var reply = document.createElement("div");
    reply.className = "msg agent";
    reply.dataset.requestId = request.request_id;
    container.appendChild(reply);
    renderReply(reply, request);
    return reply;
  }

  function renderReply(replyEl, request) {
    var text;
    var stateClass = "";
    if (request.state === "completed") {
      text = request.response || "(empty response)";
    } else if (request.state === "failed") {
      text = "Failed: " + ((request.error && request.error.message) || "unknown error");
      stateClass = "failed";
    } else if (request.state === "cancelled") {
      text = "Cancelled.";
      stateClass = "cancelled";
    } else if (request.state === "interrupted") {
      text = "Interrupted (server restarted mid-turn). Send a follow-up to continue.";
      stateClass = "interrupted";
    } else {
      text = "Thinking… (" + request.state + ")";
    }
    replyEl.innerHTML =
      '<div class="who">cluster-agent</div><div class="bubble"></div>' +
      '<div class="state ' + stateClass + '">' + request.state + '</div>';
    replyEl.querySelector(".bubble").textContent = text;
  }

  function pollUntilTerminal(requestId, replyEl) {
    function tick() {
      api("/requests/" + requestId).then(function (request) {
        renderReply(replyEl, request);
        els.transcript.scrollTop = els.transcript.scrollHeight;
        if (TERMINAL.indexOf(request.state) === -1) {
          setTimeout(tick, POLL_MS);
        } else {
          els.statusLine.textContent = "";
          state.sending = false;
        }
      }).catch(function (err) {
        if (err.message !== "unauthorized") {
          els.statusLine.textContent = "";
          els.appError.textContent = "Poll failed: " + err.message + " (retrying)";
          setTimeout(tick, POLL_MS);
        }
      });
    }
    tick();
  }

  function send() {
    var message = els.input.value.trim();
    if (!message || state.sending) return;
    state.sending = true;
    els.appError.textContent = "";
    els.input.value = "";
    els.statusLine.textContent = "Sending…";

    var path = state.sessionId ? "/sessions/" + state.sessionId + "/requests" : "/requests";
    api(path, { method: "POST", body: { message: message } }).then(function (data) {
      state.sessionId = data.session_id;
      var placeholderRequest = {
        request_id: data.request_id, identity: currentIdentityGuess(), created_at: Date.now() / 1000,
        message: message, state: data.state,
      };
      var replyEl = renderMessage(els.transcript, placeholderRequest);
      els.transcript.scrollTop = els.transcript.scrollHeight;
      els.statusLine.textContent = "Waiting for response…";
      pollUntilTerminal(data.request_id, replyEl);
    }).catch(function (err) {
      state.sending = false;
      els.statusLine.textContent = "";
      if (err.message !== "unauthorized") els.appError.textContent = "Send failed: " + err.message;
    });
  }

  // We don't know our own identity dict server-side until the request
  // resolves, but showing *something* immediately (not "undefined") beats
  // waiting for the first poll response just to label our own bubble.
  function currentIdentityGuess() { return { class: "human", name: "you" }; }

  function loadSession(sessionId) {
    els.transcript.innerHTML = "";
    els.appError.textContent = "";
    api("/sessions/" + sessionId + "/requests").then(function (requests) {
      state.sessionId = sessionId;
      els.sessions.classList.remove("open");
      requests.forEach(function (request) {
        var replyEl = renderMessage(els.transcript, request);
        if (TERMINAL.indexOf(request.state) === -1) pollUntilTerminal(request.request_id, replyEl);
      });
      els.transcript.scrollTop = els.transcript.scrollHeight;
    }).catch(function (err) {
      if (err.message !== "unauthorized") els.appError.textContent = "Failed to load session: " + err.message;
    });
  }

  function loadSessions() {
    api("/sessions").then(function (sessions) {
      sessions.sort(function (a, b) { return b.created_at - a.created_at; });
      els.sessions.innerHTML = "";
      if (!sessions.length) {
        els.sessions.innerHTML = '<div class="session-row">No sessions yet.</div>';
      }
      sessions.forEach(function (s) {
        var row = document.createElement("div");
        row.className = "session-row";
        row.innerHTML =
          identityLabel(s.identity) + " &middot; " + s.turn_count + " turn(s)" +
          "<small>" + fmtTime(s.created_at) + " &middot; " + s.session_id + "</small>";
        row.addEventListener("click", function () { loadSession(s.session_id); });
        els.sessions.appendChild(row);
      });
      els.sessions.classList.add("open");
    }).catch(function (err) {
      if (err.message !== "unauthorized") els.appError.textContent = "Failed to load sessions: " + err.message;
    });
  }

  els.loginBtn.addEventListener("click", function () {
    var t = els.tokenInput.value.trim();
    if (!t) return;
    localStorage.setItem(TOKEN_KEY, t);
    els.tokenInput.value = "";
    showApp();
  });
  els.tokenInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") els.loginBtn.click();
  });

  els.logoutBtn.addEventListener("click", function () {
    localStorage.removeItem(TOKEN_KEY);
    showLogin("");
  });

  els.newBtn.addEventListener("click", function () {
    state.sessionId = null;
    els.transcript.innerHTML = "";
    els.appError.textContent = "";
    els.sessions.classList.remove("open");
  });

  els.sessionsBtn.addEventListener("click", function () {
    if (els.sessions.classList.contains("open")) {
      els.sessions.classList.remove("open");
    } else {
      loadSessions();
    }
  });

  els.sendBtn.addEventListener("click", send);
  els.input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  els.input.addEventListener("input", function () {
    els.input.style.height = "auto";
    els.input.style.height = Math.min(els.input.scrollHeight, 140) + "px";
  });

  if (token()) { showApp(); } else { showLogin(""); }
})();
</script>
</body>
</html>
