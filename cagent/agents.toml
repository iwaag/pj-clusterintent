# cagent's agent configuration (ag.agent-config.v1).
#
# Three doors, three roles. Each answer's run record names the profile,
# harness, provider and model that actually served it — Agent ≠ Model,
# satisfied by construction rather than by a promise in prose.
#
# Per-machine backend choice belongs in the ignored `.local/agents.local.toml`
# overlay: `[roles.front] profile = "local"` switches one door back to a
# local model without touching this file.
schema = "ag.agent-config.v1"
project = "cagent"

[models."ollama/qwen3.6:35b-a3b-coding-nvfp4"]

[models."anthropic/claude-sonnet-5"]

[profiles.local]
harness = "agcode"
model = "ollama/qwen3.6:35b-a3b-coding-nvfp4"

[profiles.sonnet]
harness = "claude_code"
model = "anthropic/claude-sonnet-5"

[profiles.stub]
harness = "fake"
model = "ollama/qwen3.6:35b-a3b-coding-nvfp4"

# The authenticated doors: mTLS (node) and bearer token (human). Same
# instructions, same tools; they differ only in who may reach them.
[roles.node]
profile = "sonnet"
requires = []

[roles.human]
profile = "sonnet"
requires = []

# The conversational front: the unauthenticated `/window` route and the
# cagent- topic flow. Its in-process tool set is strictly smaller — see
# `agent_runner.window_tools()`; in the topic flow it writes handoff files
# and never touches nctl.
#
# This door stays on agcode while the others are sonnet, and that is
# structural rather than a machine preference. Those five tools run inside
# this process, so only agcode can be handed them; claude_code takes a grant
# of tool *names* and would reach the same work through `Bash`. A `Bash(...)`
# grant does not bound what runs — measured: `Bash(echo hello:*)` admits
# `echo hello && echo pwned` — and this door is unauthenticated, so a shell
# behind it is a shell for anyone on the LAN. Moving `front` to a claude_code
# profile means giving these tools to it over MCP first.
[roles.front]
profile = "local"
requires = []

# The topic flow's cluster reader: runs the read-only `cagent` CLI to gather
# what the front's `required_info.md` asks for. Out-of-process only
# (`role_run.py`); no HTTP door resolves this role.
[roles.operator]
profile = "sonnet"
requires = []
