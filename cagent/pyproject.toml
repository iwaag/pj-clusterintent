[project]
name = "cagent-api"
version = "0.0.1"
description = "cluster-agent API: loopback HTTP server proxying a dedicated OpenCode instance (pj-clusterintent, devdocs/vision/cluster_agent)"
readme = "README.md"
requires-python = ">=3.11"
# The one dependency: the shared Zulip chat entrance (`agag.zulip`). The
# rest of cagent stays stdlib-only.
dependencies = ["pyagag"]

[project.scripts]
cagent-api = "cagent_api.main:main"
cagent-evidence = "cagent_api.evidence_cli:main"
cagent-ca = "cagent_api.ca_cli:main"
cagent-ledger = "cagent_api.ledger_cli:main"

[dependency-groups]
dev = [
    "cryptography>=50.0.0",
    "pytest>=8.0",
]

[tool.uv.sources]
pyagag = { git = "https://github.com/iwaag/pyagag.git", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cagent_api"]
