services:
  postgres-nautobot-init:
    image: postgres:15-alpine
    restart: "no"
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        until pg_isready -h "$$NAUTOBOT_DB_HOST" -U admin; do
          sleep 2
        done
        psql -h "$$NAUTOBOT_DB_HOST" -U admin -d postgres -f /init/nautobot_init.sql
    environment:
      NAUTOBOT_DB_HOST: ${NAUTOBOT_DB_HOST}
      PGPASSWORD: admin
    volumes:
      - ./nautobot_init.sql:/init/nautobot_init.sql:ro

  nautobot-volume-init:
    image: alpine:latest
    restart: "no"
    command: chown -R 999:999 /opt/nautobot/static /opt/nautobot/media
    volumes:
      - nautobot_static:/opt/nautobot/static
      - nautobot_media:/opt/nautobot/media

  nautobot:
    #image: networktocode/nautobot:3.1.3-py3.12
    build:
      context: ../..
      dockerfile: devenv/nautobot/Dockerfile
    restart: always
    ports:
      - "8000:8080"
    environment:
      NAUTOBOT_SECRET_KEY: ${NAUTOBOT_SECRET_KEY}
      NAUTOBOT_ALLOWED_HOSTS: "localhost 127.0.0.1 0.0.0.0 agstudio.local testserver nautobot.example.com"
      NAUTOBOT_DB_HOST: ${NAUTOBOT_DB_HOST}
      NAUTOBOT_DB_NAME: nautobot
      NAUTOBOT_DB_USER: nautobot
      NAUTOBOT_DB_PASSWORD: nautobot
      NAUTOBOT_REDIS_HOST: ${NAUTOBOT_REDIS_HOST}
      NAUTOBOT_CREATE_SUPERUSER: "true"
      NAUTOBOT_SUPERUSER_NAME: admin
      NAUTOBOT_SUPERUSER_EMAIL: admin@example.com
      NAUTOBOT_SUPERUSER_PASSWORD: admin
      NAUTOBOT_SUPERUSER_API_TOKEN: ${NAUTOBOT_SUPERUSER_API_TOKEN:-0123456789abcdef0123456789abcdef01234567}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      - nautobot_static:/opt/nautobot/static
      - nautobot_media:/opt/nautobot/media
      - ./nautobot_config.py:/opt/nautobot/nautobot_config.py
    depends_on:
      postgres-nautobot-init:
        condition: service_completed_successfully
      nautobot-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nautobot-server", "health_check"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  nautobot-worker:
    #image: networktocode/nautobot:3.1.3-py3.12
    build:
      context: ../..
      dockerfile: devenv/nautobot/Dockerfile
    restart: always
    entrypoint: nautobot-server
    command: celery worker -l INFO --events
    environment:
      NAUTOBOT_SECRET_KEY: ${NAUTOBOT_SECRET_KEY}
      NAUTOBOT_DB_HOST: ${NAUTOBOT_DB_HOST}
      NAUTOBOT_DB_NAME: nautobot
      NAUTOBOT_DB_USER: nautobot
      NAUTOBOT_DB_PASSWORD: nautobot
      NAUTOBOT_REDIS_HOST: ${NAUTOBOT_REDIS_HOST}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      - nautobot_static:/opt/nautobot/static
      - nautobot_media:/opt/nautobot/media
      - ./nautobot_config.py:/opt/nautobot/nautobot_config.py
    depends_on:
      nautobot:
        condition: service_healthy

  nautobot-scheduler:
    #image: networktocode/nautobot:3.1.3-py3.12
    build:
      context: ../..
      dockerfile: devenv/nautobot/Dockerfile
    restart: always
    entrypoint: nautobot-server
    command: celery beat -l INFO
    environment:
      NAUTOBOT_SECRET_KEY: ${NAUTOBOT_SECRET_KEY}
      NAUTOBOT_DB_HOST: ${NAUTOBOT_DB_HOST}
      NAUTOBOT_DB_NAME: nautobot
      NAUTOBOT_DB_USER: nautobot
      NAUTOBOT_DB_PASSWORD: nautobot
      NAUTOBOT_REDIS_HOST: ${NAUTOBOT_REDIS_HOST}
    volumes:
      - nautobot_static:/opt/nautobot/static
      - nautobot_media:/opt/nautobot/media
      - ./nautobot_config.py:/opt/nautobot/nautobot_config.py
    depends_on:
      nautobot:
        condition: service_healthy

  minio:
    image: minio/minio
    restart: always
    command: server /data --console-address ":9001"
    # Host ports 9000/9001 are taken by portainer / the service_scripts MinIO,
    # so this instance is published on 9100 (S3 API) and 9101 (console).
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc
    restart: "no"
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          sleep 2
        done
        set -e
        mc mb --ignore-existing local/nctl-outbox
        mc admin policy create local nctl-outbox-rw /init/nctl_outbox_policy.json
        if ! mc admin user info local nctl >/dev/null 2>&1; then
          mc admin user add local nctl "$$NCTL_MINIO_SECRET_KEY"
        fi
        mc admin policy attach local nctl-outbox-rw --user nctl || true
        mc alias set nctluser http://minio:9000 nctl "$$NCTL_MINIO_SECRET_KEY"
        mc ls nctluser/nctl-outbox
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      NCTL_MINIO_SECRET_KEY: ${NCTL_MINIO_SECRET_KEY}
    volumes:
      - ./nctl_outbox_policy.json:/init/nctl_outbox_policy.json:ro
    depends_on:
      - minio

volumes:
  nautobot_static:
  nautobot_media:
  minio_data:
